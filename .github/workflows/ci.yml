name: ci

# Tests, and a check that every generated file in the repository is up to date: the sample DXF, its plan file and the two
# editor pages are rebuilt from their sources and must be byte-identical to what is committed.
# Package versions are those of default.nix (rix, nixpkgs 2026-02-02), installed with pip for speed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned packages of default.nix
        run: python -m pip install ezdxf==1.4.3 shapely==2.1.2 numpy==2.3.5 pillow==12.1.0 pytest==8.4.2
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Rebuild the sample drawing, its plan file and the editor pages
        run: |
          python tools/synthetic_flat.py
          python tools/validate_flat.py samples/synthetic_flat.dxf --preset presets/synthetic_flat.json
          python tools/export_plan.py samples/synthetic_flat.dxf --synthetic --output samples/synthetic_flat.plan.json
          python tools/build_editor.py --check
      - name: Generated files are up to date
        run: git diff --exit-code --stat
