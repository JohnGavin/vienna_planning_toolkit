name: pages

# Publishes site/ (the editor's GitHub Pages version, built by tools/build_editor.py and committed) on every push to main.
# GitHub Pages serves a private repository only on paid plans: on a free account this works once the repository is public,
# and Pages must be set to "GitHub Actions" as its source (Settings > Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
